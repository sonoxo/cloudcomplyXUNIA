name: NXYZ Cloud CI

on:
  push:
    paths:
      - 'nxyz-cloud/**'
  pull_request:
    paths:
      - 'nxyz-cloud/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nxyz-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: nxyz-cloud/go.mod
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: |
          go build ./cmd/controlplane
          go build ./cmd/agent
      - name: Build container targets
        run: |
          docker build --target controlplane -t nxyz-controlplane:test .
          docker build --target agent -t nxyz-agent:test .
