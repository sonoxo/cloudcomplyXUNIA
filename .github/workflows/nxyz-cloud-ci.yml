name: NXYZ Cloud CI

on:
  push:
    paths:
      - 'nxyz-cloud/**'
  pull_request:
    paths:
      - 'nxyz-cloud/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nxyz-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: nxyz-cloud/go.mod
      - name: Validate shell syntax
        run: bash -n scripts/start-local.sh scripts/stop-local.sh scripts/run-host-agent.sh scripts/install-nxyz-command.sh scripts/nxyz-tools.sh scripts/smoke.sh
      - name: Smoke test offline tool flows
        run: |
          export NXYZ_LOCAL_STATE_DIR="$RUNNER_TEMP/nxyz"
          bash scripts/nxyz-tools.sh tools | grep -q 'storage'
          bash scripts/nxyz-tools.sh storage create ci
          printf 'nxyz-ci\n' > "$RUNNER_TEMP/object.txt"
          bash scripts/nxyz-tools.sh storage put ci "$RUNNER_TEMP/object.txt" object.txt
          bash scripts/nxyz-tools.sh storage list ci | grep -q 'object.txt'
          bash scripts/nxyz-tools.sh secrets set ci-token test-value
          test "$(bash scripts/nxyz-tools.sh secrets get ci-token)" = 'test-value'
          bash scripts/nxyz-tools.sh git create ci
          bash scripts/nxyz-tools.sh git list | grep -q '^ci$'
          bash scripts/nxyz-tools.sh dns add api 127.0.0.1:8080
          test "$(bash scripts/nxyz-tools.sh dns resolve api)" = '127.0.0.1:8080'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: |
          go build ./cmd/controlplane
          go build ./cmd/agent
      - name: Build container targets
        run: |
          docker build --target controlplane -t nxyz-controlplane:test .
          docker build --target agent -t nxyz-agent:test .
